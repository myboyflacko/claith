[project]
name = "claith"
version = "0.1.0"
description = "Turn human-approved plans into reliably completed software deliveries with minimal intervention"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.163.0",
]

[project.scripts]
claith = "claith:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
