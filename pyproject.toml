[project]
name = "claith"
version = "0.1.0"
description = "Self-hosted agentic development environment that turns approved Delivery Contracts into evidence-backed software outcomes with minimal developer attention"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "openai-codex>=0.163.0",
    "pydantic>=2.12",
]

[project.scripts]
claith = "claith:main"
claith-login = "claith.application.login:main"
claith-thread-start = "claith.application.start_thread:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
