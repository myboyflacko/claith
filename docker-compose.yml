# Local development only: https://docs.temporal.io/cli/setup-cli
services:
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "--address", "127.0.0.1:7233", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  temporal-data:
